# Render.com blueprint: one free web service running the SpendGuard demo.
# After pushing to GitHub: Render dashboard -> New -> Blueprint -> pick the repo. Then set the secret env vars.
services:
  - type: web
    name: spendguard-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: RELOAD
        value: "0"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DEMO_COOLING_OFF_SECONDS
        value: "60"
      - key: GEMINI_API_KEY
        sync: false        # paste in the dashboard; never commit keys
      - key: GEMINI_API_KEYS
        sync: false
      - key: DEMO_ACCESS_TOKEN
        sync: false        # share the link as https://<service>.onrender.com/?token=<value>
